  Object.values(nodes).forEach(N => { N.w += (N.target - N.w) * ease; N.mats.forEach(([m, o]) => m.opacity = o * N.w); N.label.opacity = Math.max(0, (N.w - .2) / .8);
    if (N.cloud && !reduced) { N.cloud.rotation.y = t * .07 + N.t.pos[0]; N.cloud.rotation.x = Math.sin(t * .05 + N.t.pos[1]) * .2; }
    if (N.ring) N.ring.rotation.set(1.2, reduced ? .4 : t * .2, 0); });
  arcs.forEach(A => { A.w += (A.target - A.w) * ease; A.tube.material.opacity = A.baseOp * A.w; A.pts.material.opacity = .95 * A.w; A.tag.material.opacity = tagsOn ? Math.max(0, (A.w - .5) * 2) : Math.max(0, A.tag.material.opacity - .08);
    const p = A.pts.geometry.attributes.position; for (let i = 0; i < A.pn; i++) { const u = (A.off[i] + (reduced ? 0 : t * A.speed)) % 1; A.curve.getPoint(u, v); p.setXYZ(i, v.x, v.y, v.z); } p.needsUpdate = true; });
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
frame();
</script>
