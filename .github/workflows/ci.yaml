# Tests, lint, the vault's own check, and the compatibility check against a pinned commit of the Discourse Graphs repository.
name: CI
permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

env:
  UPSTREAM_COMMIT: 1ae4c0022b92ae0ee02f39ef250dbfbe10a3815e

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Checkout the Discourse Graphs repository
        uses: actions/checkout@v6
        with:
          repository: DiscourseGraphs/discourse-graph
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: demo/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm ci:validate

      - name: Lint
        run: pnpm lint

      - name: Vault check
        working-directory: .
        run: python tools/dm/check_all.py

      - name: Compatibility with the Discourse Graphs plugin
        run: pnpm run check:upstream
        env:
          DG_REPO: ${{ github.workspace }}/upstream
